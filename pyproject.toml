[project]
name = "dancesync"
version = "0.1.0"
description = "Aligns a slowed-down dance practice recording to its original-speed reference track."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "librosa>=0.10",
    "soundfile>=0.12",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dancesync*", "server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
