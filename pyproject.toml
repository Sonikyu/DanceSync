[project]
name = "dancesync"
version = "0.1.0"
description = "Aligns a slowed-down dance practice recording to its original-speed reference track."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "librosa>=0.10",
    "soundfile>=0.12",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    # YouTube import. YouTube breaks yt-dlp every few weeks; updating it is
    # a chore: pip install -U 'yt-dlp[default]'. [default] brings yt-dlp-ejs,
    # which YouTube needs along with a JavaScript runtime (Deno).
    "yt-dlp[default]>=2025.11.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dancesync*", "server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests that reach the internet run only when asked for: pytest -m network
addopts = "-m 'not network'"
markers = ["network: needs the internet; skipped unless run with -m network"]
