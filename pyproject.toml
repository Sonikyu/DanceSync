[project]
name = "dancesync"
version = "0.1.0"
description = "Aligns a slowed-down dance practice recording to its original-speed reference track."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "librosa>=0.10",
    "soundfile>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dancesync*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
